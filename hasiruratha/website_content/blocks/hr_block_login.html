<div class="hrb hrb-login" id="hr-login">
<style>
.hrb-login{background:#f4f6f5;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0}
.hrb-login .hrb-wrap{max-width:1240px;margin:0 auto;padding:0 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.hrb-login h3{margin:0 0 4px;font-size:22px}
.hrb-login p{margin:0;color:var(--mu);font-size:15px}
.hrb-lb{display:flex;gap:10px;flex-wrap:wrap}
.hrb-btn.out{background:#fff;color:var(--g)!important}
.hrb-btn.out:hover{background:#f1f5f4}
.hrb-login .hrb-btn{display:inline-block;background:var(--g);color:#fff!important;text-decoration:none!important;padding:12px 22px;border-radius:3px;font-weight:700;font-size:14px;border:1px solid var(--g)}
.hrb-login .hrb-btn.out{background:#fff;color:var(--g)!important}
</style>
<div class="hrb-wrap">
  <div><h3 id="hr-login-title">{{ values.title | e }}</h3><p id="hr-login-text">{{ values.text | e }}</p></div>
  <div class="hrb-lb" id="hr-login-btns">
    <a class="hrb-btn" href="{{ values.login_link or '/login' }}">{{ values.login_label or 'Log in' | e }}</a>
    <a class="hrb-btn out" href="{{ values.signup_link or '/login#signup' }}">{{ values.signup_label or 'Create account' | e }}</a>
  </div>
</div>
<script>
(function(){
  function ck(n){var m=document.cookie.split('; ').filter(function(r){return r.indexOf(n+'=')===0})[0];return m?decodeURIComponent(m.split('=').slice(1).join('=').replace(/\+/g,' ')):'';}
  var u=ck('user_id'),nm=ck('full_name')||u;
  if(!u||u==='Guest')return;
  var t=document.getElementById('hr-login-title'),x=document.getElementById('hr-login-text'),b=document.getElementById('hr-login-btns');
  if(!t)return;
  t.textContent='Welcome, '+nm;
  x.textContent='You are logged in. Track the status of your reports and plantings, or plant, report or volunteer above.';
  b.innerHTML='<a class="hrb-btn" href="/my-reports">My reports</a><a class="hrb-btn" href="/my-trees">My trees</a><a class="hrb-btn out" href="/me">My account</a><a class="hrb-btn out" href="#" id="hr-logout">Log out</a>';
  document.getElementById('hr-logout').addEventListener('click',function(e){e.preventDefault();fetch('/api/method/logout',{credentials:'same-origin'}).then(function(){location.reload();});});
})();
</script>
</div>
