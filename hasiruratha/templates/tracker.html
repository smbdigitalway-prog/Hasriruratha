<div class="hrt" id="hrt" data-kind="{{ tk.kind }}" data-empty="{{ tk.empty }}" data-new="{{ tk.new_url }}" data-newlabel="{{ tk.new_label }}">
<style>
.hrt{--g:#1b3a33;--g2:#2f6b57;--line:#e3e8e6;--mu:#5d6b66;max-width:980px;margin:8px auto 48px}
.hrt *{box-sizing:border-box}
.hrt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hrt-head h1{margin:0 0 4px;font-size:34px;font-weight:800;color:#111}
.hrt-head p{margin:0;color:var(--mu)}
.hrt-btns{display:flex;gap:10px;flex-wrap:wrap}
.hrt-btn{display:inline-block;background:var(--g);color:#fff!important;text-decoration:none!important;padding:10px 18px;border-radius:4px;font-weight:700;font-size:14px;border:1px solid var(--g)}
.hrt-btn.out{background:#fff;color:var(--g)!important}
.hrt-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 20px}
.hrt-sum div{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fafcfb}
.hrt-sum b{display:block;font-size:26px;color:var(--g)}
.hrt-sum span{font-size:13px;color:var(--mu)}
.hrt-card{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fff;overflow:hidden}
.hrt-top{display:flex;gap:14px;padding:16px;align-items:flex-start}
.hrt-img{width:76px;height:76px;border-radius:8px;object-fit:cover;background:#eef2f0;flex:none}
.hrt-main{flex:1;min-width:0}
.hrt-main h3{margin:0 0 4px;font-size:18px;color:#111}
.hrt-meta{font-size:13px;color:var(--mu)}
.hrt-chip{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#e8f1ed;color:var(--g);white-space:nowrap}
.hrt-chip.done{background:var(--g);color:#fff}
.hrt-chip.bad{background:#fdecea;color:#a12622}
.hrt-steps{display:flex;padding:4px 16px 18px;overflow-x:auto}
.hrt-step{flex:1;min-width:86px;text-align:center;position:relative;font-size:12px;color:var(--mu)}
.hrt-step i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #c5d0cb;margin:0 auto 6px;position:relative;z-index:1}
.hrt-step:not(:first-child)::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#c5d0cb}
.hrt-step.on i{background:var(--g2);border-color:var(--g2)}
.hrt-step.on:not(:first-child)::before{background:var(--g2)}
.hrt-step.now{color:#111;font-weight:700}
.hrt-step.now i{box-shadow:0 0 0 4px #d6e8e0}
.hrt-more{border-top:1px solid var(--line);padding:10px 16px;font-size:13px}
.hrt-more summary{cursor:pointer;color:var(--g);font-weight:700}
.hrt-hist{list-style:none;margin:10px 0 0;padding:0}
.hrt-hist li{padding:6px 0 6px 14px;border-left:2px solid var(--g2);margin-left:4px;color:var(--mu)}
.hrt-hist li b{color:#111}
.hrt-det{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;margin-top:12px}
.hrt-det span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.hrt-empty{text-align:center;border:1px dashed var(--line);border-radius:10px;padding:48px 16px;color:var(--mu)}
@media(max-width:600px){.hrt-sum{grid-template-columns:1fr 1fr 1fr}.hrt-head h1{font-size:26px}.hrt-top{flex-wrap:wrap}}
</style>
<div class="hrt-head">
  <div><h1>{{ tk.heading }}</h1><p>{{ tk.sub }}</p></div>
  <div class="hrt-btns"><a class="hrt-btn out" href="{{ tk.other_url }}">{{ tk.other_label }}</a><a class="hrt-btn" href="{{ tk.new_url }}">{{ tk.new_label }}</a></div>
</div>
<div id="hrt-sum"></div>
<div id="hrt-list"><div class="hrt-empty">Loading…</div></div>
<script>
(function(){
  var root=document.getElementById('hrt'),kind=root.dataset.kind;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fd(s){var d=new Date(String(s).replace(' ','T'));return isNaN(d)?esc(s):d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
  function empty(){return '<div class="hrt-empty"><p>'+esc(root.dataset.empty)+'</p><a class="hrt-btn" href="'+esc(root.dataset.new)+'">'+esc(root.dataset.newlabel)+'</a></div>';}
  function card(it,steps,neg){
    var last=steps.length-1,bad=neg.indexOf(it.status)>-1,done=it.step>-1&&it.step===last&&steps.length>1;
    var chip='<span class="hrt-chip'+(bad?' bad':done?' done':'')+'">'+esc(it.status||'Received')+'</span>';
    var h='<div class="hrt-card"><div class="hrt-top">'+(it.photo?'<img class="hrt-img" src="'+esc(it.photo)+'" alt="">':'')+
      '<div class="hrt-main"><h3>'+esc(it.title)+'</h3><div class="hrt-meta">'+(it.tree_id?'ID '+esc(it.tree_id)+' · ':'')+(it.area?esc(it.area)+' · ':'')+'Submitted '+fd(it.created)+' · Updated '+fd(it.updated)+'</div></div>'+chip+'</div>';
    if(steps.length>1&&!bad){
      h+='<div class="hrt-steps">'+steps.map(function(s,i){var on=it.step>-1?i<=it.step:i===0;var now=it.step>-1?i===it.step:i===0;return '<div class="hrt-step'+(on?' on':'')+(now?' now':'')+'"><i></i>'+esc(s)+'</div>';}).join('')+'</div>';
    }
    var hist=(it.history||[]).slice().reverse();
    h+='<div class="hrt-more"><details><summary>View history &amp; details</summary><ul class="hrt-hist">'+
      hist.map(function(x){return '<li><b>'+esc(x.status)+'</b> · '+fd(x.on)+'</li>';}).join('')+'<li><b>Submitted</b> · '+fd(it.created)+'</li></ul>';
    if((it.details||[]).length)h+='<div class="hrt-det">'+it.details.map(function(d){return '<div><span>'+esc(d.label)+'</span>'+esc(d.value)+'</div>';}).join('')+'</div>';
    return h+'</details></div></div>';
  }
  fetch('/api/method/hasiruratha.api.tracker.get_my_items?kind='+kind,{credentials:'same-origin'})
   .then(function(r){if(r.status===401||r.status===403){location.href='/login?redirect-to='+encodeURIComponent(location.pathname);throw 0;}return r.json();})
   .then(function(j){
      var d=j.message||{items:[],steps:[],negative:[]},items=d.items||[],steps=d.steps||[],neg=d.negative||[];
      var last=steps.length-1,done=items.filter(function(i){return i.step>-1&&i.step===last&&steps.length>1;}).length,bad=items.filter(function(i){return neg.indexOf(i.status)>-1;}).length;
      document.getElementById('hrt-sum').innerHTML=items.length?'<div class="hrt-sum"><div><b>'+items.length+'</b><span>Total</span></div><div><b>'+(items.length-done-bad)+'</b><span>In progress</span></div><div><b>'+done+'</b><span>Completed</span></div></div>':'';
      document.getElementById('hrt-list').innerHTML=items.length?items.map(function(i){return card(i,steps,neg);}).join(''):empty();
   }).catch(function(e){if(e!==0)document.getElementById('hrt-list').innerHTML='<div class="hrt-empty">Could not load your submissions. Please refresh.</div>';});
})();
</script>
</div>
