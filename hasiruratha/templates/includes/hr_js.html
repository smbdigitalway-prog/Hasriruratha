{#- Small helpers shared by the citizen pages. Include near the end of {% block script %}. -#}
<script>
window.HR = {
	async call(method, args, post) {
		args = args || {};
		const opt = { headers: { Accept: "application/json" }, credentials: "same-origin" };
		let url = "/api/method/" + method;
		if (post) {
			opt.method = "POST";
			opt.headers["Content-Type"] = "application/json";
			opt.headers["X-Frappe-CSRF-Token"] = (window.frappe && frappe.csrf_token) || "";
			opt.body = JSON.stringify(args);
		} else if (Object.keys(args).length) {
			url += "?" + new URLSearchParams(args);
		}
		let r, j = {};
		try { r = await fetch(url, opt); } catch (e) { throw new Error("No connection. Please check your internet and try again."); }
		try { j = await r.json(); } catch (e) {}
		if (!r.ok) throw new Error(HR.err(j) || "Something went wrong. Please try again.");
		return j.message;
	},
	err(j) {
		try {
			const m = JSON.parse(j._server_messages || "[]");
			if (m.length) return String(JSON.parse(m[0]).message || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
		} catch (e) {}
		return "";
	},
	esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	},
	$(sel) { return document.querySelector(sel); },
	/** Show a message in a Frappe (Espresso) alert; empty text hides it. kind: err | warn | ok */
	msg(el, text, kind) {
		el.className = "es-alert" + (text ? "" : " hr-hidden");
		el.setAttribute("role", "alert");
		el.dataset.theme = { err: "red", warn: "yellow", ok: "green" }[kind || "err"];
		el.innerHTML = text ? `<span class="es-alert__title">${HR.esc(text)}</span>` : "";
	},
	/** Shrink a phone photo to max 1280 px JPEG (about 150-300 KB) and upload it as a public file. */
	async uploadPhoto(file) {
		const blob = await HR.shrink(file, 1280, 0.72);
		const fd = new FormData();
		fd.append("file", blob, "tree-" + Date.now() + ".jpg");
		fd.append("is_private", "0");
		fd.append("folder", "Home");
		const r = await fetch("/api/method/upload_file", { method: "POST", body: fd, credentials: "same-origin",
			headers: { Accept: "application/json", "X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || "" } });
		let j = {}; try { j = await r.json(); } catch (e) {}
		if (!r.ok || !j.message) throw new Error(HR.err(j) || "The photo could not be uploaded. Please try again.");
		return { url: j.message.file_url, kb: Math.round(blob.size / 1024) };
	},
	shrink(file, max, quality) {
		return new Promise((resolve, reject) => {
			const url = URL.createObjectURL(file), img = new Image();
			img.onload = () => {
				let w = img.naturalWidth, h = img.naturalHeight;
				const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
				const c = document.createElement("canvas"); c.width = w; c.height = h;
				c.getContext("2d").drawImage(img, 0, 0, w, h);
				URL.revokeObjectURL(url);
				c.toBlob(b => b ? resolve(b) : reject(new Error("Could not read the photo")), "image/jpeg", quality);
			};
			img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read the photo. Please choose a JPG or PNG.")); };
			img.src = url;
		});
	},
	tiles(map) {
		L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
			maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
		}).addTo(map);
	},
	treeIcon(kind) {
		const bg = kind === "pick" ? "#c2410c" : kind === "me" ? "#2563eb" : "#13774f";
		return L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
			html: `<div style="width:26px;height:26px;border-radius:50%;background:${bg};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px">${kind === "me" ? "" : "🌳"}</div>` });
	},
};
(function () {
	const so = document.getElementById("hr-signout");
	if (so) so.onclick = async (e) => {
		e.preventDefault();
		try { await HR.call("hasiruratha.citizen_auth.sign_out", {}, true); } catch (err) {}
		location.href = "/trees";
	};
})();
</script>
