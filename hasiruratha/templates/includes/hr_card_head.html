{#- Card header in the same layout as Frappe's /login page. Set card_title / card_sub before including. -#}
<div class="page-card-head flex flex-col items-start gap-4 text-left">
	<img class="app-logo" src="{{ logo }}" alt="">
	<div class="page-card-head-text flex flex-col gap-1.5 w-full">
		<h4 class="text-3xl-bold text-ink-gray-9 w-full mt-0 mb-0">{{ card_title }}</h4>
		{% if card_sub %}<p class="page-card-subtitle text-p-base text-ink-gray-6 mb-0">{{ card_sub }}</p>{% endif %}
	</div>
</div>
