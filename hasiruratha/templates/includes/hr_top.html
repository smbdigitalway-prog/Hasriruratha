{#- Secondary navigation for the citizen pages, under Frappe's own website navbar.
    Set `hr_page` in the page context to mark the current page. -#}
<nav class="hr-subnav" aria-label="Hasiru Ratha">
	<a class="es-button" data-variant="{{ 'subtle' if hr_page == 'map' else 'ghost' }}" href="/trees">Map</a>
	<a class="es-button" data-variant="{{ 'subtle' if hr_page == 'request' else 'ghost' }}" href="/request">Request</a>
	{% if frappe.session.user != "Guest" %}
	<a class="es-button" data-variant="{{ 'subtle' if hr_page == 'mine' else 'ghost' }}" href="/my-requests">My requests</a>
	<a class="es-button" data-variant="ghost" href="#" id="hr-signout">Sign out</a>
	{% else %}
	<a class="es-button" data-variant="{{ 'subtle' if hr_page == 'login' else 'ghost' }}" href="/citizen-login">Sign in</a>
	{% endif %}
</nav>
