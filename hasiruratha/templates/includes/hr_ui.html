{#- Shared bits for the citizen/volunteer web pages. They use Frappe's own website design (Espresso:
    .es-button, .es-badge, .es-alert, .form-control, utility classes, --ink/--surface/--outline tokens),
    so they look like the rest of Frappe. This file only adds layout Frappe has no component for. -#}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
.hr-page{max-width:560px;margin:0 auto;padding:0 0 48px}
.hr-subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 20px;padding:2px 0}
.hr-section{padding:20px 0;border-top:1px solid var(--outline-gray-1)}
.hr-section:first-of-type{border-top:0;padding-top:4px}
.hr-page h1,.hr-page h2,.hr-page h3{margin-top:0}
.hr-step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
	background:var(--surface-gray-2);color:var(--ink-gray-7);font-size:12px;font-weight:600;margin-right:8px;flex:none}
.hr-page .form-group{margin-bottom:12px}
.hr-page label{display:block;margin:0 0 6px;color:var(--ink-gray-5);font-size:var(--text-base, 14px)}
.hr-page label .opt{color:var(--ink-gray-4)}
.hr-page .form-control{width:100%}
.hr-page textarea.form-control{min-height:76px;resize:vertical}
.hr-row{display:flex;gap:12px}.hr-row>*{flex:1;min-width:0}
.hr-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hr-choice button,.hr-item{border:1px solid var(--outline-gray-2);background:var(--surface-base, #fff);color:var(--ink-gray-8);
	border-radius:var(--radius-lg, 10px);cursor:pointer;text-align:left;font:inherit}
.hr-choice button{padding:14px 12px;line-height:1.35}
.hr-choice button b{display:block;font-weight:600;margin:6px 0 2px;color:var(--ink-gray-9)}
.hr-choice button span{color:var(--ink-gray-5);font-size:13px}
.hr-choice .ico{font-size:22px}
.hr-choice button.on,.hr-item.on{border-color:var(--ink-gray-8);box-shadow:0 0 0 1px var(--ink-gray-8);background:var(--surface-gray-1)}
.hr-item{display:flex;gap:12px;align-items:center;width:100%;padding:10px;margin-top:8px}
.hr-item .t{font-weight:600;color:var(--ink-gray-9)}.hr-item .s{color:var(--ink-gray-5);font-size:13px}
.hr-thumb{width:56px;height:56px;border-radius:var(--radius-md, 8px);object-fit:cover;background:var(--surface-gray-2);
	flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.hr-map{height:300px;border-radius:var(--radius-lg, 10px);overflow:hidden;border:1px solid var(--outline-gray-2);background:var(--surface-gray-1)}
.hr-check{display:flex !important;gap:10px;align-items:flex-start;color:var(--ink-gray-7) !important}
.hr-check input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--ink-gray-9)}
.hr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.hr-hidden{display:none !important}
.hr-page .es-alert{margin-top:12px}
.hr-page .es-button[data-size="lg"]{width:100%}
.leaflet-container{font:inherit}
@media (max-width:575px){.hr-page{padding:0 0 32px}}
</style>
